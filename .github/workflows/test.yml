name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The code uses Set methods and iterator helpers from Node 22.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

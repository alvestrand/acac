<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <script src="https://geni.com/jsdk.js"></script>
  <script src="./index.js" type="module"></script>
  <div id="cache-size-box">
    Cache entries: <span id="cache-size">0</span>
  </div>
  <h1>All Common Ancestors Considered</h1>
  <div id="error-message" hidden></div>
  <button id="login-to-geni" hidden>Login to Geni</button>
  <div id="documentation-link">
    <strong><a href="doc/index.html">Documentation</a></strong>
  </div>
  <button id="save-database">Save database</button>
  <button id="export-file">Save to file</button>
  <button id="import-file">Load from file</button>
  <input type="file" id="import-file-input" accept=".json,application/json" hidden></input>
  <button id="build-tree">Build tree</button>
  <button id="recalculate-groups">Recalculate groups</button><br/>
  <label>
    Limit for tree building
    <input type="number" id="year-limit" value="1800"></input>
  </label><br/>
  <label>
    Age limit for path search
    <input type="number" id="path-age-limit" value="1600"></input>
  </label><br/>
  <label>
    Length limit for path search
    <input type="number" id="path-length-limit" value="25"></input>
  </label>
  <br/>
  <span id="queue-size">Queue empty</span>
  <button id="stop-fetching" hidden>Stop fetching</button>
  <table id="layout">
    <tr>
      <td colspan="2">
        <table class="group-controls">
          <tr>
            <td class="group-actions">
              <h2 class="group-heading">
                <label for="group-select">Group:</label>
                <select id="group-select"></select>
              </h2>
              <div id="group-action-buttons">
                <button id="new-group">New group</button>
                <button id="save-group">Save group</button>
                <button id="load-group">Load group</button>
              </div>
              <div id="new-group-box" hidden>
                <label>
                  Name:<input type="text" id="new-group-name">
                </label>
                <button id="new-group-create">Create</button>
                <button id="new-group-cancel">Cancel</button>
              </div>
              <p>
                <input type="file" id="load-group-input" accept=".json,application/json" hidden>
                <span id="group-file-message"></span>
              </p>
              <p>
                Add profile:<input type="text" id="add-profile">
                <button id="add-profile-now">Add!</button>
              </p>
              <div id="add-profile-message"></div>
            </td>
            <td class="group-notes-cell">
              <label class="group-notes">
                <span>Notes:</span>
                <textarea id="group-notes" aria-label="Group notes" rows="3"></textarea>
              </label>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td>
        <h2>Profiles we are finding paths from</h2>
        <label>
          <input type="checkbox" id="initials-only">
          Show initials only (for sharing screenshots)
        </label>
        <div id="profile-list">
        </div>
      </td>
      <td>
        <h2>Person groups and common ancestors</h2>
        <p>
          Grouping:<select id="algorithm-select"></select>
          <label id="display-path-label">
            <input type="checkbox" id="display-path"> Display path
          </label>
        </p>
        <div id="group-list">
        </div>
      </td>
    </tr>
  </table>
  <a href="privacy.html">Privacy statement</a>
  
</body>
</html>
